<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="bar">
    <div class="titlewrap">
      <div class="org" id="org" title="Azure DevOps organization">…</div>
      <div class="org-sub">Azure DevOps Org</div>
    </div>
    <button class="gear" id="gear" title="Choose sections" aria-label="Choose sections"
      aria-expanded="false" aria-controls="panel">&#9881;</button>
  </header>

  <section class="panel" id="panel" hidden>
    <div class="panel-title" id="panelTitle">Sections to include</div>
    <div class="section-list" id="sectionList" role="group" aria-labelledby="panelTitle"></div>
  </section>

  <div class="actions">
    <button id="generate" class="primary">Generate</button>
    <button id="regenerate" hidden>Regenerate</button>
    <button id="copy" hidden>Copy</button>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <textarea id="output" class="output" readonly spellcheck="false"
    placeholder="Click Generate to build the Markdown, then Ctrl+A / Ctrl+C." hidden></textarea>

  <!-- Vendored UMD (classic scripts) set window.TurndownService / window.turndownPluginGfm -->
  <script src="../vendor/turndown.umd.js"></script>
  <script src="../vendor/turndown-plugin-gfm.umd.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
